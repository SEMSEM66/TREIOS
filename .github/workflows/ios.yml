name: iOS

# The iPhone app (web-dev/ios). There is no Mac behind this repository: these runs are the only build and test
# environment, so every job prints what it finds and uploads its logs, screenshots and result bundles even when a
# step fails. A push to `ios` ends with the unsigned IPA and the asset packs on the release `ios-latest`.
on:
  push:
    branches: [ios]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  RELEASE_TAG: ios-latest

jobs:
  test:
    name: Tests and asset check (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Engine tests
        run: node --test web-dev/tests/*.test.mjs
      - name: Asset check
        run: python3 web-dev/ios/ci/check_assets_repo.py

  packs:
    name: Asset packs and probe clips (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write   # the release that holds the packs
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: What this runner has
        run: |
          nproc; free -g | head -2; df -h / | tail -1
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          ffmpeg -version | head -1
      - name: Test clips for the compat probe
        run: web-dev/ios/make_probe_media.sh
      - name: Upload the test clips
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: probe-media
          path: web-dev/ios/build/probe-media
          retention-days: 30
      - name: Build the asset packs
        run: |
          python3 web-dev/tools/build_ios_packs.py
          ls -l web-dev/ios/build/packs | head -50
          df -h / | tail -1
      - name: Upload the index
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: asset-pack-index
          path: web-dev/ios/build/packs/index.json
          retention-days: 30
      - name: Publish the packs on the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: web-dev/ios/ci/publish_packs.sh "$RELEASE_TAG" web-dev/ios/build/packs

  app:
    name: App (${{ matrix.name }})
    needs: packs
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    permissions:
      contents: write   # the IPA goes on the release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: iOS 26 simulator
            runner: macos-26
            xcode: '26.6'
            ios: '26'
            ipa: true
    env:
      DEVELOPER_DIR: /Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer
      SIM_OS: ${{ matrix.ios }}
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
      ASSET_URL: https://github.com/${{ github.repository }}/releases/download/ios-latest/
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: What this runner has
        run: |
          sw_vers
          sysctl -n machdep.cpu.brand_string hw.ncpu hw.memsize
          df -h /
          ls -d /Applications/Xcode*.app
          xcodebuild -version
          xcrun simctl list runtimes
          xcrun simctl list devicetypes | grep -i "iphone 1[6-9]" || true
          python3 --version
      - name: Install XcodeGen
        run: brew install xcodegen && xcodegen --version
      - name: Fetch the probe's test clips
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: probe-media
          path: web-dev/ios/build/probe-media
      - name: Build (simulator app and unsigned IPA)
        id: build
        run: web-dev/ios/build_ipa.sh --sim --device --asset-url "$ASSET_URL"
      - name: Upload the IPA
        if: always() && matrix.ipa
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Tsukihime-unsigned-ipa
          path: web-dev/ios/build/Tsukihime-unsigned.ipa
          if-no-files-found: warn
          retention-days: 30
      - name: Publish the IPA on the release
        if: matrix.ipa
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$RELEASE_TAG" web-dev/ios/build/Tsukihime-unsigned.ipa --clobber --repo "$GITHUB_REPOSITORY"
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --notes "The unsigned IPA and the asset packs of the iOS app, replaced by every push to the \`ios\` branch. This build: commit $GITHUB_SHA, run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. How to install it: web-dev/ios/README.md."

      - name: Boot an iPhone 16 simulator
        id: boot
        run: web-dev/ios/ci/sim.sh boot
      - name: Install
        id: install
        run: web-dev/ios/ci/sim.sh install web-dev/ios/build/Tsukihime-sim.app
      - name: Compat probe
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        timeout-minutes: 8
        run: web-dev/ios/ci/sim.sh run probe 180 '\[probe\] result saved' -TsukiProbe 1
      - name: The game, with its files read from the checkout (the page's process is ended once on the way)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        timeout-minutes: 10
        env:
          QUIET: '1'
          SHOTS: '0'
        run: web-dev/ios/ci/sim.sh run game 115 "" -TsukiAssetsDir "$GITHUB_WORKSPACE/web/assets" -TsukiAutopilot 1 -TsukiSnapshotEvery 8 -TsukiTestMemoryWarningAt 45 -TsukiTestEndPageAt 55 -TsukiQuitAfter 105
      - name: Fresh install
        id: fresh
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        timeout-minutes: 5
        run: web-dev/ios/ci/sim.sh install web-dev/ios/build/Tsukihime-sim.app
      - name: First launch, download from the release, cut short
        if: ${{ !cancelled() && steps.fresh.outcome == 'success' }}
        timeout-minutes: 5
        run: web-dev/ios/ci/sim.sh run download-cut-short 20 "" -TsukiAutoDownload 1
      - name: Second launch, the download goes on to its end and the game starts
        if: ${{ !cancelled() && steps.fresh.outcome == 'success' }}
        timeout-minutes: 35
        env:
          SHOT_EVERY: '5'
        run: web-dev/ios/ci/sim.sh run download 1500 '\[download\] complete' -TsukiAutoDownload 1 -TsukiStayOnDownload 1
      - name: Third launch, the game from the downloaded files
        if: ${{ !cancelled() && steps.fresh.outcome == 'success' }}
        timeout-minutes: 8
        env:
          QUIET: '1'
          SHOTS: '0'
        run: web-dev/ios/ci/sim.sh run downloaded-game 85 "" -TsukiAutopilot 1 -TsukiSnapshotEvery 8 -TsukiQuitAfter 75
      - name: Simulator log, shut down
        if: ${{ always() && steps.boot.outcome == 'success' }}
        timeout-minutes: 6
        run: |
          df -h /
          web-dev/ios/ci/sim.sh finish
      - name: Upload logs, screenshots and result bundles
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-${{ matrix.runner }}-ios${{ matrix.ios }}
          path: |
            web-dev/ios/build/ci
            web-dev/ios/build/logs
            web-dev/ios/build/*.xcresult
          if-no-files-found: warn
          retention-days: 30
